[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "gaeja"
version = "0.1.0"
description = "Point-in-time pedestrian-flow feature pipeline for Zurich Lintheschergasse"
requires-python = ">=3.13"
dependencies = [
  "pandas==2.3.3",
  "numpy==2.3.4",
  "pyarrow==22.0.0",
  "requests==2.32.5",
  "scikit-learn==1.7.2",
  "holidays==0.84",
  "tzdata==2025.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.3", "reportlab==4.4.4", "pypdf==6.2.0"]

[project.scripts]
gaeja = "gaeja.cli:main"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/gaeja"]
